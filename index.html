<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autocarro · Linha Suburbana</title>
<meta name="theme-color" content="#0b0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Autocarro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0f0e;
    --panel: #12181a;
    --panel-2: #1a2224;
    --line: rgba(255,255,255,0.09);
    --ink: #eef2f0;
    --muted: #7c8985;
    /* uma cor por destino — ver COLOR / URBAN_DEST */
    --c-amber: #ffb703;   /* Coimbra B */
    --c-teal: #34d1c0;    /* República */
    --c-violet: #a98bfa;  /* Vale das Flores */
    --c-rose: #ff7597;    /* Serpins */
    --c-blue: #5b9dff;    /* Lousã */
    --c-green: #6fd964;   /* Corvo */
    --c-orange: #ff8c42;  /* Miranda do Corvo */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 700px 400px at 50% -10%, rgba(255,183,3,0.07), transparent),
      var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    display:flex; justify-content:center;
    padding:16px 12px 24px;
    min-height:100%;
  }
  .app{width:100%; max-width:420px;}

  .top{display:flex; justify-content:flex-end; align-items:center; margin-bottom:14px;}
  .clock{font-family:'IBM Plex Mono', monospace; font-size:0.95rem; color:var(--muted);}

  .stationpick{position:relative; margin-bottom:12px;}
  .sp-label{display:block; font-size:0.78rem; color:var(--muted); margin-bottom:6px;}
  .sp-input-row{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:13px;
    padding:12px 14px;
  }
  .sp-input-row svg{flex:none; opacity:.6;}
  #stationInput{
    flex:1; border:none; outline:none; background:transparent;
    color:var(--ink); font-family:'Work Sans', sans-serif; font-weight:700; font-size:1.25rem;
    padding:0; min-width:0;
  }
  #stationInput::placeholder{color:var(--muted); font-weight:500;}
  .sp-results{
    position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20;
    background:var(--panel-2); border:1px solid var(--line); border-radius:13px;
    max-height:260px; overflow-y:auto; display:none;
    box-shadow:0 14px 30px rgba(0,0,0,0.45);
  }
  .sp-results.open{display:block;}
  .sp-item{padding:11px 14px; font-size:0.98rem; cursor:pointer; border-bottom:1px solid var(--line);}
  .sp-item:last-child{border-bottom:none;}
  .sp-item:active{background:rgba(255,183,3,0.09);}
  .sp-empty{padding:14px; font-size:0.85rem; color:var(--muted);}

  .dirswitch{
    display:flex; background:var(--panel); border:1px solid var(--line);
    border-radius:13px; padding:4px; margin-bottom:12px; gap:3px;
  }
  input[name="dir"], input[name="dia"]{ display:none; }
  .dirswitch label{
    flex:1; text-align:center; padding:11px 4px; border-radius:10px;
    cursor:pointer; transition:background .15s, color .15s;
  }
  .dirswitch label .arrow{font-size:1.05rem; display:block; margin-bottom:1px; color:var(--muted);}
  .dirswitch label .txt{font-size:0.82rem; color:var(--muted); font-weight:600;}
  #dirA:checked ~ .dirswitch label[for="dirA"],
  #dirB:checked ~ .dirswitch label[for="dirB"]{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  #dirA:checked ~ .dirswitch label[for="dirA"] .txt,
  #dirB:checked ~ .dirswitch label[for="dirB"] .txt{ color:var(--ink); }
  #dirA:checked ~ .dirswitch label[for="dirA"] .arrow,
  #dirB:checked ~ .dirswitch label[for="dirB"] .arrow{ color:var(--c-amber); }

  .hero{
    position:relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 20px 16px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; inset:0 0 auto 0; height:2px;
    background: linear-gradient(90deg, var(--c-amber), var(--c-teal));
    opacity:.55;
  }
  .hero .label{font-size:0.8rem; color:var(--muted);}
  .hero .row{display:flex; align-items:flex-end; justify-content:space-between; margin-top:8px; gap:10px;}
  .hero .time{
    font-family:'IBM Plex Mono', monospace; font-weight:600;
    font-size:2.8rem; line-height:1; letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
  }
  .hero .countdown{font-size:0.9rem; color:var(--muted); margin-top:6px;}
  .hero .countdown b{color:var(--ink); font-weight:600;}
  .pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.76rem; font-weight:600; letter-spacing:.03em;
    padding:6px 11px; border-radius:999px; white-space:nowrap;
    display:inline-block;
  }

  .segmented{
    display:flex; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:3px; margin-bottom:10px; gap:2px;
  }
  .segmented label{
    flex:1; text-align:center; padding:8px 2px; font-size:0.82rem;
    color:var(--muted); border-radius:9px; cursor:pointer; transition:background .15s, color .15s;
  }
  #t0:checked ~ .segmented label[for="t0"],
  #t1:checked ~ .segmented label[for="t1"],
  #t2:checked ~ .segmented label[for="t2"]{
    background:var(--panel-2); color:var(--ink); font-weight:600;
  }
  .board{background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden;}
  .list{max-height:min(42vh, 340px); overflow-y:auto;}
  .rowline{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; border-bottom:1px solid var(--line); gap:10px;
  }
  .rowline:last-child{border-bottom:none;}
  .rowline .t{
    font-family:'IBM Plex Mono', monospace; font-size:1.02rem; font-weight:500;
    font-variant-numeric: tabular-nums;
  }
  .rowline.past{opacity:0.32;}
  .rowline.next{background:rgba(255,183,3,0.06);}
  .rowline.next .t{color:var(--c-amber); font-weight:700;}
  .destchip{font-size:0.76rem; font-weight:600; letter-spacing:.02em; text-align:right;}
  .empty-list{padding:22px 16px; text-align:center; color:var(--muted); font-size:0.9rem;}


  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="stationpick" id="stationpick">
    <label class="sp-label" for="stationInput">a minha estação</label>
    <div class="sp-input-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="stationInput" type="text" autocomplete="off" placeholder="Escreve o nome (ex.: Solum)" />
    </div>
    <div class="sp-results" id="stationResults"></div>
  </div>

  <input type="radio" name="dir" id="dirA" autocomplete="off" checked>
  <input type="radio" name="dir" id="dirB" autocomplete="off">
  <div class="dirswitch" id="subDirswitch">
    <label for="dirA"><span class="arrow">→</span><span class="txt">Para Coimbra</span></label>
    <label for="dirB"><span class="arrow">←</span><span class="txt">De Coimbra</span></label>
  </div>

  <div class="hero" id="hero">
    <div class="label" id="heroLabel">próximo autocarro</div>
    <div class="row">
      <div>
        <div class="time" id="heroTime">--:--</div>
        <div class="countdown" id="heroCountdown">a calcular…</div>
      </div>
      <div id="heroPill"></div>
    </div>
  </div>

  <input type="radio" name="dia" id="t0" autocomplete="off">
  <input type="radio" name="dia" id="t1" autocomplete="off">
  <input type="radio" name="dia" id="t2" autocomplete="off">
  <div class="segmented">
    <label for="t0">Dias úteis</label>
    <label for="t1">Sábados</label>
    <label for="t2">Dom. / Fer.</label>
  </div>

  <div class="board"><div class="list" id="list"></div></div>


</div>

 13:47r 13:49c 14:06r 14:22r 14:33c 14:47r 14:49c 15:06r 15:17r 15:19c 15:36r 15:47r 15:49c 16:02r 16:04c 16:22r 16:33c 16:47r 16:49c 17:06r 17:17r 17:19c 17:36r 17:47r 17:49c 18:06r 18:22r 18:33c 18:47r 18:49c 19:06r 19:17r 19:19c 19:36r 19:47r 19:49c 20:06r 20:22r 20:33c 20:47r 20:49c 21:06r 21:17r 21:19c 21:36r 21:47r 21:49c 22:05r 22:15r 22:30r 22:31c 22:50r 23:05r 23:17r 23:19c 23:37r 23:55r","Mercado":"00:07c 00:09r 00:26r 06:16r 06:31r 06:42c 06:48r 07:00c 07:17c 07:18r 07:37r 07:53r 08:02c 08:03r 08:24r 08:33c 08:48r 08:48c 09:08r 09:18r 09:18c 09:38r 09:48r 09:48c 10:08r 10:24r 10:32c 10:48r 10:48c 11:08r 11:18r 11:18c 11:38r 11:48r 11:48c 12:08r 12:24r 12:32c 12:48r 12:48c 13:08r 13:18r 13:18c 13:40r 13:48r 13:48c 14:08r 14:24r 14:32c 14:48r 14:48c 15:08r 15:18r 15:18c 15:38r 15:48r 15:48c 16:03r 16:03c 16:24r 16:32c 16:48r 16:48c 17:08r 17:18r 17:18c 17:38r 17:48r 17:48c 18:08r 18:24r 18:32c 18:48r 18:48c 19:08r 19:18r 19:18c 19:38r 19:48r 19:48c 20:08r 20:24r 20:32c 20:48r 20:48c 21:08r 21:18r 21:18c 21:38r 21:48r 21:48c 22:07r 22:17r 22:30c 22:32r 22:52r 23:07r 23:18r 23:18c 23:39r 23:57r","República":"00:05c 06:40c 06:58c 07:15c 08:00c 08:31c 08:46c 09:16c 09:46c 10:30c 10:46c 11:16c 11:46c 12:30c 12:46c 13:16c 13:46c 14:30c 14:46c 15:16c 15:46c 16:01c 16:30c 16:46c 17:16c 17:46c 18:30c 18:46c 19:16c 19:46c 20:30c 20:46c 21:16c 21:46c 22:28c 23:16c","Coimbra B":"00:01r 00:18r 06:23r 07:29r 07:45r 08:16r 09:00r 09:30r 10:00r 10:16r 11:00r 11:30r 12:00r 12:16r 13:00r 13:32r 14:00r 14:16r 15:00r 15:30r 16:16r 17:00r 17:30r 18:00r 18:16r 19:00r 19:30r 20:00r 20:16r 21:00r 21:30r 21:59r 22:09r 22:24r 22:44r 22:59r 23:31r 23:49r"}}};
const URBAN_DEST = {v:{nome:"Vale das Flores", cor:"var(--c-violet)"}, c:{nome:"Coimbra B", cor:"var(--c-amber)"}, r:{nome:"República", cor:"var(--c-teal)"}};

let currentStation = DEFAULT_STATION;

function typeForWeekday(w){ return DAY_LABEL[w]; }
function isChegada(){ return document.getElementById("dirA").checked; }
function currentDirKey(){ return isChegada() ? "chegada" : "partida"; }
function norm(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }

/* Minutos desde as 05:00 do dia de serviço (o que for antes das 5h é
   madrugada seguinte, como no resto da app). */
function toMin(t){ const [h,m] = t.split(":").map(Number); return (h < 5 ? h+24 : h)*60 + m; }
// os dados do suburbano trazem "9:00"; os da urbana "09:00" — com a mesma
// identidade visual, a coluna só alinha se todas tiverem dois dígitos
function hhmm(t){ const [h,m] = t.split(":"); return h.padStart(2,"0") + ":" + m; }

/* Passagens da urbana nesta paragem, neste sentido e dia. */
function urbanSeriesAt(station, dirKey, dayType){
  const raw = (URBAN_DATA[dayType][dirKey] || {})[station];
  if (!raw) return [];
  return raw.split(" ").map(e => {
    const d = URBAN_DEST[e.slice(5)];
    return {min: toMin(e.slice(0,5)), hora: e.slice(0,5), nome: d.nome, cor: d.cor, urb: true};
  });
}

function updateChrome(){
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
}
function fmtCountdown(ms){
  const min = Math.round(ms/60000);
  if (min <= 0) return "a chegar";
  if (min < 60) return min + " min";
  const h = Math.floor(min/60), r = min%60;
  return h + "h" + String(r).padStart(2,"0");
}

/* Decide which end of the trip to label.
   Normally the destination. But if every trip at this stop has the SAME
   destination (e.g. at Coimbra B every trip ends at Coimbra B), that tells
   you nothing — show where the bus comes from instead. */
function labelMode(entries){
  if (entries.length === 0) return {field: 1};
  const dests = new Set(entries.map(e => e[1]));
  if (dests.size > 1) return {field: 1};
  const origs = new Set(entries.map(e => e[2]));
  if (origs.size > 1) return {field: 2};
  return {field: 1};
}

const stationInput = document.getElementById("stationInput");
const resultsEl = document.getElementById("stationResults");

function showResults(query){
  const q = norm(query || "");
  const matches = STATIONS.filter(s => norm(s).includes(q));
  resultsEl.innerHTML = matches.length
    ? matches.map(s => `<div class="sp-item" data-station="${s}">${s}</div>`).join("")
    : '<div class="sp-empty">Sem estações com esse nome</div>';
  resultsEl.classList.add("open");
}
function hideResults(){ resultsEl.classList.remove("open"); }

stationInput.addEventListener("focus", () => showResults(""));
stationInput.addEventListener("input", () => showResults(stationInput.value));
resultsEl.addEventListener("click", (e) => {
  const item = e.target.closest(".sp-item");
  if (item && item.dataset.station) selectStation(item.dataset.station);
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".stationpick")) hideResults();
});
stationInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter"){
    const q = norm(stationInput.value);
    const pick = STATIONS.find(s => norm(s) === q) || STATIONS.find(s => norm(s).includes(q));
    if (pick) selectStation(pick);
    stationInput.blur();
  }
});

async function selectStation(name){
  currentStation = name;
  stationInput.value = name;
  hideResults();
  try { localStorage.setItem("estacao_escolhida", name); } catch(e){}
  render(true);
}

async function init(){
  let saved = null;
  try {
    const v = localStorage.getItem("estacao_escolhida");
    if (v && STATIONS.includes(v)) saved = v;
  } catch(e){}
  currentStation = saved || DEFAULT_STATION;
  stationInput.value = currentStation;


  const todayType = typeForWeekday(new Date().getDay());
  document.getElementById("t" + TYPE_KEYS.indexOf(todayType)).checked = true;

  document.querySelectorAll('input[name="dia"], input[name="dir"]')
    .forEach(r => r.addEventListener("change", () => render(true)));
  render(true);
  setInterval(render, 20000);
}

/* Centra a linha do próximo autocarro na lista. Observa essa linha com
   ResizeObserver porque a Google Font pode carregar depois deste primeiro
   cálculo e mudar a altura das linhas — sem isto a rolagem ficava
   desalinhada assim que a fonte trocava. */
const snapObserver = new ResizeObserver(() => snapNow());
let snapTarget = null;
function snapNow(){
  if (!snapTarget || !snapTarget.isConnected) return;
  const listEl = document.getElementById("list");
  const delta = snapTarget.getBoundingClientRect().top - listEl.getBoundingClientRect().top;
  const top = listEl.scrollTop + delta - listEl.clientHeight/2 + snapTarget.clientHeight/2;
  listEl.scrollTop = Math.max(0, top);
}
function armSnap(target){
  snapObserver.disconnect();
  snapTarget = target;
  snapObserver.observe(target);
  snapNow();
}
function disarmSnap(){
  snapObserver.disconnect();
  snapTarget = null;
}

function render(scrollToNext){
  updateChrome();
  const now = new Date();

  const dirKey = currentDirKey();
  const todayType = typeForWeekday(now.getDay());
  const activeIdx = [...document.querySelectorAll('input[name="dia"]')].findIndex(r=>r.checked);
  const activeType = TYPE_KEYS[activeIdx === -1 ? TYPE_KEYS.indexOf(todayType) : activeIdx];
  const isToday = activeType === todayType;

  const stationActive = FULL_DATA[activeType][dirKey][currentStation] || [];
  const stationToday  = FULL_DATA[todayType][dirKey][currentStation] || [];

  const mode = labelMode(stationActive);

  // Quando se mostra a origem em vez do destino, o nome sozinho é ambíguo
  // ("Serpins" tanto lê como "vai para" como "vem de"). O prefixo resolve.
  const prefix = mode.field === 2 ? "de " : "";

  // Uma só tabela: suburbano + urbana, por ordem de hora.
  const linhas = stationActive.map(e => ({
    min: toMin(e[0]), hora: hhmm(e[0]), nome: prefix + NAME[e[mode.field]],
    cor: COLOR[e[mode.field]], urb: false
  }));
  linhas.push(...urbanSeriesAt(currentStation, dirKey, activeType));
  linhas.sort((a,b) => a.min - b.min || (a.urb - b.urb));

  const agora = now.getHours()*60 + now.getMinutes() + (now.getHours() < 5 ? 24*60 : 0);
  let nextIdx = -1;
  if (isToday) nextIdx = linhas.findIndex(l => l.min > agora);

  const listEl = document.getElementById("list");
  if (linhas.length === 0){
    listEl.innerHTML = '<div class="empty-list">Esta estação não tem serviço neste sentido/dia.</div>';
  } else {
    listEl.innerHTML = linhas.map((l, i) => {
      const past = isToday && nextIdx !== -1 && i < nextIdx;
      return `<div class="rowline ${past?'past':''} ${i===nextIdx?'next':''} ${l.urb?'urb':''}">
        <span class="t">${l.hora}</span>
        <span class="destchip" style="color:${l.cor}">${l.nome}</span>
      </div>`;
    }).join("");

    if (scrollToNext){
      if (nextIdx !== -1) armSnap(listEl.children[nextIdx]);
      else { disarmSnap(); listEl.scrollTop = 0; }
    }
  }


  const heroLabel = document.getElementById("heroLabel");
  const heroTime = document.getElementById("heroTime");
  const heroCountdown = document.getElementById("heroCountdown");
  const heroPill = document.getElementById("heroPill");

  // O hero usa o dia de HOJE, juntando também a urbana — senão anunciava
  // um autocarro mais tarde do que o que a tabela mostra a seguir.
  const todayMode = labelMode(stationToday);
  const todayPrefix = todayMode.field === 2 ? "de " : "";
  const chip = (nome, cor) =>
    `<span class="pill" style="color:${cor};background:color-mix(in srgb, ${cor} 12%, transparent);border:1px solid color-mix(in srgb, ${cor} 35%, transparent)">${nome}</span>`;

  const hoje = stationToday.map(e => ({
    min: toMin(e[0]), hora: hhmm(e[0]), nome: todayPrefix + NAME[e[todayMode.field]],
    cor: COLOR[e[todayMode.field]], urb: false
  }));
  hoje.push(...urbanSeriesAt(currentStation, dirKey, todayType));
  hoje.sort((a,b) => a.min - b.min);

  const idx = hoje.findIndex(l => l.min > agora);

  if (idx === -1){
    heroLabel.textContent = "sem mais autocarros hoje";
    heroTime.textContent = "—";
    heroCountdown.innerHTML = "";
    heroPill.innerHTML = "";
  } else {
    const nb = hoje[idx];
    heroLabel.textContent = nb.urb ? "próximo autocarro · urbana" : "próximo autocarro";
    heroTime.textContent = nb.hora;
    heroCountdown.innerHTML = "daqui a <b>" + fmtCountdown((nb.min - agora)*60000) + "</b>";
    heroPill.innerHTML = chip(nb.nome, nb.cor);
  }
}

init();
</script>
