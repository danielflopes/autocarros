<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autocarros 2 · Planeador</title>
<meta name="theme-color" content="#0b0f0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Autocarros">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0b0f0e; --panel:#12181a; --panel-2:#1a2224;
    --line:rgba(255,255,255,0.09); --ink:#eef2f0; --muted:#7c8985;
    --amber:#ffb703; --teal:#34d1c0; --rose:#ff7597;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    margin:0; color:var(--ink); font-family:'Work Sans',sans-serif;
    background:radial-gradient(ellipse 700px 400px at 50% -10%, rgba(255,183,3,0.07), transparent), var(--bg);
    display:flex; justify-content:center;
    /* viewport-fit=cover + barra de estado translúcida: sem isto o topo fica sob a ilha dinâmica */
    padding:calc(16px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
            calc(40px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  }
  .app{width:100%; max-width:460px;}
  /* app no ecrã principal: garante espaço para a barra de estado / ilha dinâmica
     mesmo que o env() venha a 0 (iPhone com ilha: 59pt; com entalhe: 47pt) */
  @media (display-mode: standalone){
    body{padding-top:calc(max(env(safe-area-inset-top), 50px) + 12px);}
  }
  h1{font-size:1.15rem; margin:0; font-weight:700; letter-spacing:-.01em;}
  .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px;}
  .top small{color:var(--muted); font-size:.78rem;}
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px;}
  .fields{position:relative; display:flex; flex-direction:column; gap:8px;}
  .field{position:relative;}
  .field label{display:block; font-size:.74rem; color:var(--muted); margin:0 0 4px 2px;}
  .field .row{
    display:flex; align-items:center; gap:8px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:12px; padding:0 6px 0 12px;
  }
  .field .row:focus-within{border-color:rgba(255,183,3,.55);}
  .field input{
    flex:1; min-width:0; border:none; outline:none; background:transparent; color:var(--ink);
    font:600 1.05rem 'Work Sans',sans-serif; padding:12px 0;
  }
  .field input::placeholder{color:var(--muted); font-weight:500;}
  .iconbtn{
    flex:none; width:38px; height:38px; border:none; background:transparent; color:var(--muted);
    border-radius:10px; cursor:pointer; display:grid; place-items:center;
  }
  .iconbtn:active{background:rgba(255,255,255,.07); color:var(--ink);}
  .swap{
    position:absolute; right:16px; top:50%; transform:translateY(-4px); z-index:3;
    width:34px; height:34px; border-radius:50%; background:var(--panel); border:1px solid var(--line);
    color:var(--amber); cursor:pointer; display:grid; place-items:center;
  }
  .sugg{
    position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:30;
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    max-height:300px; overflow-y:auto; display:none; box-shadow:0 14px 30px rgba(0,0,0,.5);
  }
  .sugg.open{display:block;}
  .sugg .it{padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer;}
  .sugg .it:last-child{border-bottom:none;}
  .sugg .it:active,.sugg .it.hl{background:rgba(255,183,3,.09);}
  .sugg .n{font-size:.96rem; font-weight:600;}
  .sugg .s{font-size:.74rem; color:var(--muted); margin-top:1px;}
  .sugg .tag{font-size:.66rem; color:var(--amber); margin-left:6px; font-weight:600;}
  .sugg .msg{padding:10px 14px; font-size:.8rem; color:var(--muted);}

  .when{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .seg{display:flex; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; flex:1 1 100%;}
  .seg button{
    flex:1; border:none; background:transparent; color:var(--muted); padding:8px 2px;
    border-radius:8px; font:500 .82rem 'Work Sans',sans-serif; cursor:pointer;
  }
  .seg button.on{background:var(--panel); color:var(--ink); font-weight:600;}
  .when input[type=date],.when input[type=time]{
    flex:1; min-width:0; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    border-radius:11px; padding:9px 10px; font:500 .95rem 'IBM Plex Mono',monospace; color-scheme:dark;
  }
  .when input:disabled{opacity:.4;}
  .go{
    width:100%; margin-top:10px; border:none; border-radius:12px; padding:13px;
    background:var(--amber); color:#1b1300; font:700 1rem 'Work Sans',sans-serif; cursor:pointer;
  }
  .go:disabled{opacity:.45;}
  .go:active:not(:disabled){filter:brightness(.92);}

  .mb{
    display:inline-grid; place-items:center; width:16px; height:16px; margin-right:6px; vertical-align:1px;
    border-radius:50%; background:#0b0f0e; border:1.5px solid var(--amber); color:var(--amber);
    font:800 .68rem/1 'Work Sans',sans-serif; text-transform:lowercase; flex:none; padding-bottom:1px;
  }
  .mb.mapb{width:20px; height:20px; margin:0; font-size:.85rem; box-shadow:0 0 0 2px rgba(11,15,14,.7);}
  .note{margin:12px 2px 0; font-size:.78rem; color:var(--muted); line-height:1.4;}
  .warn{
    margin-top:12px; padding:10px 12px; border-radius:12px; font-size:.82rem; line-height:1.4;
    background:rgba(255,183,3,.09); border:1px solid rgba(255,183,3,.3); color:#ffd77a;
  }
  #map{height:230px; border-radius:14px; margin-top:14px; border:1px solid var(--line); display:none; background:var(--panel);}
  #map.show{display:block;}
  .leaflet-container{background:#0d1214; font-family:'Work Sans',sans-serif;}
  /* mosaicos claros do OSM → tema escuro */
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.7);}

  #results{margin-top:14px; display:flex; flex-direction:column; gap:10px;}
  .share{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.8rem; color:var(--muted);}
  .share span{margin-right:2px;}
  .share a{
    color:var(--ink); text-decoration:none; font-weight:600; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:8px 12px;
  }
  .share a:active{background:var(--panel-2);}
  .walkonly{font-size:.85rem; color:var(--muted); padding:0 2px;}
  .walkonly b{color:var(--ink);}
  .jr{background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden;}
  .jr.sel{border-color:rgba(255,183,3,.55);}
  .jr-head{
    display:block; width:100%; text-align:left; background:transparent; border:none; color:inherit;
    padding:13px 14px; cursor:pointer; font-family:inherit;
  }
  .jr-times{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .jr-times .t{font-size:1.5rem; font-weight:600; letter-spacing:-.02em;}
  .jr-times .t i{font-style:normal; color:var(--muted); margin:0 4px; font-weight:400;}
  .jr-times .d{font-size:.9rem; color:var(--muted);}
  .jr-times .d b{color:var(--ink);}
  .chips{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:9px;}
  .chip{
    font:700 .76rem 'IBM Plex Mono',monospace; padding:3px 8px; border-radius:7px; white-space:nowrap;
  }
  .chip.w{background:var(--panel-2); color:var(--muted); font-weight:500; display:inline-flex; gap:4px; align-items:center;}
  .chips .sep{color:var(--muted); font-size:.7rem;}
  .jr-sub{font-size:.78rem; color:var(--muted); margin-top:8px;}
  .best{font-size:.68rem; color:var(--teal); font-weight:700; margin-left:8px; letter-spacing:.03em; text-transform:uppercase;}

  .detail{display:none; padding:2px 14px 14px; border-top:1px solid var(--line);}
  .jr.sel .detail{display:block;}
  .leg{display:grid; grid-template-columns:48px 1fr; gap:0 10px; padding-top:12px;}
  .leg .tm{font:500 .88rem 'IBM Plex Mono',monospace; color:var(--ink); text-align:right; padding-top:1px;}
  .leg .tm.dim{color:var(--muted);}
  .leg .bd{border-left:3px solid var(--line); padding:0 0 4px 12px; margin-left:-1px;}
  .leg .st{font-size:.95rem; font-weight:600;}
  .leg .sm{font-size:.8rem; color:var(--muted); margin-top:3px; line-height:1.4;}
  .leg .line{display:inline-block; margin-right:6px; vertical-align:1px;}
  .stoplist{margin:6px 0 2px; padding:0; list-style:none; font-size:.8rem; color:var(--muted);}
  .stoplist li{display:flex; gap:10px; padding:2px 0;}
  .stoplist .mono{width:44px; text-align:right; flex:none;}
  .toggle{background:none; border:none; color:var(--amber); font:600 .78rem 'Work Sans',sans-serif; padding:4px 0; cursor:pointer;}
  .empty{padding:22px 16px; text-align:center; color:var(--muted); font-size:.9rem;}
  .foot{margin:22px 2px 0; font-size:.72rem; color:var(--muted); line-height:1.5;}
  .foot a{color:var(--muted);}
  .spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.2); border-top-color:var(--amber); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  ::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Autocarros <span style="color:var(--amber)">2</span></h1>
    <small id="feedInfo">Metro Mondego + SMTUC</small>
  </div>

  <div class="card">
    <div class="fields">
      <div class="field" id="fFrom">
        <label for="inFrom">De</label>
        <div class="row">
          <input id="inFrom" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Origem: rua, sítio ou paragem">
          <button class="iconbtn" id="gps" type="button" title="Usar a minha localização" aria-label="Usar a minha localização">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
          </button>
        </div>
        <div class="sugg" id="sgFrom"></div>
      </div>
      <button class="swap" id="swap" type="button" title="Trocar origem e destino" aria-label="Trocar origem e destino">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 4v16M7 20l-4-4M7 20l4-4M17 20V4M17 4l-4 4M17 4l4 4"/></svg>
      </button>
      <div class="field" id="fTo">
        <label for="inTo">Para</label>
        <div class="row">
          <input id="inTo" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Destino: rua, sítio ou paragem">
        </div>
        <div class="sugg" id="sgTo"></div>
      </div>
    </div>

    <div class="when">
      <div class="seg" id="mode">
        <button type="button" data-m="now" class="on">Partir agora</button>
        <button type="button" data-m="dep">Partir às</button>
        <button type="button" data-m="arr">Chegar até</button>
      </div>
      <input type="date" id="inDate" aria-label="Data">
      <input type="time" id="inTime" aria-label="Hora">
    </div>
    <button class="go" id="go" type="button" disabled>A carregar horários…</button>
  </div>

  <div id="banner"></div>
  <div id="map"></div>
  <div id="results"></div>

  <p class="foot">
    Horários programados, sem tempo real. Os percursos a pé são estimados em linha reta
    (×1,3, 4,3&nbsp;km/h). Locais: © <a href="https://www.openstreetmap.org/copyright">contribuidores do OpenStreetMap</a>
    via <a href="https://photon.komoot.io">Photon</a>. Dados: Metro Mondego (planeador) e SMTUC
    (<a href="https://dados.gov.pt/en/datasets/gtfs-estaticos-servicos-municipalizados-de-transportes-urbanos-de-coimbra/">dados.gov.pt</a>).
  </p>
  <p class="foot" id="build">versão 2 · build 24-09-2026 b</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="router.js"></script>
<script src="app.js"></script>
</body>
</html>
